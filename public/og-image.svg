<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap');

      .display { font-family: 'Instrument Serif', Georgia, serif; }
      .sans { font-family: 'Instrument Sans', system-ui, sans-serif; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
    </style>

    <radialGradient id="bloom" cx="0.1" cy="0" r="0.85">
      <stop offset="0%" stop-color="#2a45d8" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#2a45d8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#2a45d8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0 L0 0 0 72" fill="none" stroke="#121216" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#f7f6f3"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#bloom)"/>

  <!-- The mark: four crop marks around a single cobalt point. -->
  <g transform="translate(92 78)">
    <g fill="none" stroke="#121216" stroke-width="2.4" stroke-linecap="square">
      <path d="M2 13V2h11"/>
      <path d="M46 13V2H35"/>
      <path d="M2 35v11h11"/>
      <path d="M46 35v11H35"/>
    </g>
    <circle cx="24" cy="24" r="4.6" fill="#2a45d8"/>
  </g>

  <text x="168" y="122" class="display" font-size="42" fill="#121216" letter-spacing="-0.5">Arqeno</text>

  <text x="92" y="288" class="display" font-size="66" fill="#121216" letter-spacing="-1.6">Digital products and software</text>
  <text x="92" y="366" class="display" font-size="66" fill="#2a45d8" letter-spacing="-1.6">for real-world problems.</text>

  <text x="92" y="444" class="sans" font-size="26" fill="#5a5a64">A founder-led software studio — web applications, product interfaces</text>
  <text x="92" y="482" class="sans" font-size="26" fill="#5a5a64">and AI-powered tools.</text>

  <rect x="92" y="540" width="120" height="3" fill="#2a45d8"/>
  <text x="236" y="550" class="mono" font-size="20" fill="#6e6e78" letter-spacing="3">ARQENO.PAGES.DEV</text>
</svg>
